# Render Blueprint — one-click deployment for the AgriFlow API.
# In the Render dashboard: New + -> Blueprint -> connect this repo.
services:
  - type: web
    name: agriflow-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT
